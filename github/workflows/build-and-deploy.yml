steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20.x'
      cache: 'pnpm'
      cache-dependency-path: '**/pnpm-lock.yaml'

  - name: Enable corepack (pnpm)
    run: corepack enable && corepack prepare pnpm@latest --activate

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Build
    run: pnpm build
    env:
      BASE_PATH: ${{ env.BASE_PATH }}

  - name: Verify build outputs
    run: |
      set -euo pipefail
      html=./dist/index.html
      if [ ! -f "$html" ]; then
        echo "dist/index.html not found"
        exit 1
      fi
      grep -oP '(?<=src=")[^"]+(?=")|(?<=href=")[^"]+(?=")' "$html" \
        | while read -r asset; do
            normalized=${asset#"/"}
            normalized=${normalized#"/game-server-hosting-landing/"}
            case "$normalized" in
              http*|//*) continue ;;
            esac
            if [ -z "$normalized" ]; then
              continue
            fi
            if [ ! -f "dist/$normalized" ]; then
              echo "Missing asset referenced in index.html: $asset (expected dist/$normalized)"
              exit 1
            fi
          done
      echo "All referenced assets exist in dist"

  - name: Configure Pages
    uses: actions/configure-pages@v3

  - name: Upload artifact for Pages
    uses: actions/upload-pages-artifact@v1
    with:
      path: ./dist

  - name: Deploy to GitHub Pages
    uses: actions/deploy-pages@v1
